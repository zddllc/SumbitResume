name: Windows and Linux checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux font and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei xvfb
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m pyright
      - name: Real graphical Chrome smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python deploy/linux-browser-smoke.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
