# Include inside the existing HTTP/HTTPS server block.
# Copy frontend/dist CONTENTS to /srv/resume; do not serve the repository itself.
# The enclosing http block must include the standard mime.types file.
location = /resume {
    return 308 /resume/;
}

location = /resume/api {
    return 308 /resume/api/;
}

location ^~ /resume/api/ {
    # Preserve the complete URI: the Python app is mounted at /resume.
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache off;
    client_max_body_size 11m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location ^~ /resume/assets/ {
    root /srv;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location /resume/ {
    root /srv;
    index index.html;
    try_files $uri $uri/ /resume/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
}
